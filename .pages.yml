# Pages CMS settings (https://pagescms.org)
# Lets Cytron team members edit wiki pages and upload images in the browser at
# https://app.pagescms.org, signing in with GitHub or with their email.
# Saves go straight to the live wiki (main branch): the site updates in 2-3 minutes.
#
# Phase 1: edit existing pages and upload images. Creating, renaming and deleting
# pages is switched off because new pages must also be added to the menu
# (sidebars.js) and renamed pages break links.

media:
  - name: images
    label: Images
    input: static/img
    output: /img
    extensions: [png, jpg, jpeg, webp, svg, gif]
    rename: safe
settings:
  content: {merge: true}
  commit:
    identity: user
    templates: {update: 'Update {path} (via Pages CMS)', create: 'Add {path} (via Pages CMS)'}
content:
  - name: products
    label: Products
    type: group
    items:
      - name: iriv-picontrol
        label: IRIV PiControl
        type: collection
        path: docs/products/iriv-picontrol
        subfolders: true
        format: yaml-frontmatter
        operations: {create: false, rename: false, delete: false}
        fields:
          - {name: title, label: Page title (browser tab and search results), type: string, required: true}
          - {name: sidebar_label, label: Name in the left menu, type: string}
          - {name: sidebar_position, label: Order in the left menu (1 = top), type: number}
          - {name: description, label: 'Short description (search engines, about 150 characters)', type: text, required: true}
          - name: body
            label: Page content (Markdown)
            type: code
            options: {format: markdown}
      - name: iriv-io-controller
        label: IRIV IO Controller
        type: collection
        path: docs/products/iriv-io-controller
        format: yaml-frontmatter
        operations: {create: false, rename: false, delete: false}
        fields:
          - {name: title, label: Page title (browser tab and search results), type: string, required: true}
          - {name: sidebar_label, label: Name in the left menu, type: string}
          - {name: sidebar_position, label: Order in the left menu (1 = top), type: number}
          - {name: description, label: 'Short description (search engines, about 150 characters)', type: text, required: true}
          - name: body
            label: Page content (Markdown)
            type: code
            options: {format: markdown}
      - name: iriv-smarthub-cm5
        label: IRIV SmartHub CM5
        type: collection
        path: docs/products/iriv-smarthub-cm5
        format: yaml-frontmatter
        operations: {create: false, rename: false, delete: false}
        fields:
          - {name: title, label: Page title (browser tab and search results), type: string, required: true}
          - {name: sidebar_label, label: Name in the left menu, type: string}
          - {name: sidebar_position, label: Order in the left menu (1 = top), type: number}
          - {name: description, label: 'Short description (search engines, about 150 characters)', type: text, required: true}
          - name: body
            label: Page content (Markdown)
            type: code
            options: {format: markdown}
      - name: iriv-edgeai-cm5
        label: IRIV EdgeAI CM5
        type: collection
        path: docs/products/iriv-edgeai-cm5
        format: yaml-frontmatter
        operations: {create: false, rename: false, delete: false}
        fields:
          - {name: title, label: Page title (browser tab and search results), type: string, required: true}
          - {name: sidebar_label, label: Name in the left menu, type: string}
          - {name: sidebar_position, label: Order in the left menu (1 = top), type: number}
          - {name: description, label: 'Short description (search engines, about 150 characters)', type: text, required: true}
          - name: body
            label: Page content (Markdown)
            type: code
            options: {format: markdown}
  - name: kits
    label: Kits & Solutions
    type: collection
    path: docs/kits
    exclude: [index.mdx]
    format: yaml-frontmatter
    operations: {create: false, rename: false, delete: false}
    fields:
      - {name: title, label: Page title (browser tab and search results), type: string, required: true}
      - {name: sidebar_label, label: Name in the left menu, type: string}
      - {name: sidebar_position, label: Order in the left menu (1 = top), type: number}
      - {name: description, label: 'Short description (search engines, about 150 characters)', type: text, required: true}
      - name: body
        label: Page content (Markdown)
        type: code
        options: {format: markdown}
  - name: software
    label: Software
    type: group
    items:
      - name: iriv-edgeai-studio
        label: IRIV EdgeAI Studio
        type: collection
        path: docs/software/iriv-edgeai-studio
        subfolders: true
        format: yaml-frontmatter
        operations: {create: false, rename: false, delete: false}
        fields:
          - {name: title, label: Page title (browser tab and search results), type: string, required: true}
          - {name: sidebar_label, label: Name in the left menu, type: string}
          - {name: sidebar_position, label: Order in the left menu (1 = top), type: number}
          - {name: description, label: 'Short description (search engines, about 150 characters)', type: text, required: true}
          - name: body
            label: Page content (Markdown)
            type: code
            options: {format: markdown}
